<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda Interactiva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="./script.js"></script>
    <link rel="stylesheet" href="styles.css">

</head>
  <body>

    <div>
        <!-- Encabezado -->
        <h1 class="text-center">Tienda Interactiva</h1>
        <!-- Formulario -->
        <div class="form-floating">
            <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
              <option selected>Productos</option>
              <option value="1">Computador</option>
              <option value="2">Mouse</option>
              <option value="3">Teclado</option>
            </select>
            <label for="floatingSelect">Selecciona uno</label>
          </div>
          <!-- Tarjeta -->
          <div class="card" id="card1" style="width: 18rem;">
            <img src="..." class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-title">Computador</h5>
              <p class="card-text">Precio: $5.000.000</p>
              <a href="#" class="btn btn-primary">Agregar al carrito</a>
            </div>
          </div>
          <div>
            <button type="button" class="btn btn-primary btn-lg">Comprar</button>
          <div id="carrito"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
</html>
